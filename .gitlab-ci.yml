stages:
  - build
  - test
  - security-scan
  - build-image
  - deploy-staging
  - security-test
  - deploy-production
  - monitor

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_DRIVER: overlay2
  APP_NAME: "devsecops-demo"

cache:
  paths:
    - .m2/repository/

build:
  stage: build
  image: maven:3.8.1-openjdk-11
  script:
    - mvn clean compile
  artifacts:
    paths:
      - target/
    expire_in: 1 hour

unit-test:
  stage: test
  image: maven:3.8.1-openjdk-11
  script:
    - mvn test
  artifacts:
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml

dependency-check:
  stage: security-scan
  image: owasp/dependency-check:latest
  script:
    - /usr/share/dependency-check/bin/dependency-check.sh --project "$APP_NAME" --scan . --format XML --format HTML --out dependency-check-report
  artifacts:
    paths:
      - dependency-check-report/
  allow_failure: true

build-docker:
  stage: build-image
  image: docker:20.10.16
  script:
    - mvn package -DskipTests
    - docker build -t $APP_NAME:$CI_COMMIT_SHA .

deploy-staging:
  stage: deploy-staging
  script:
    - docker run -d --name staging-app -p 8081:8080 $APP_NAME:$CI_COMMIT_SHA
