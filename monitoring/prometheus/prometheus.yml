global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - "alert_rules.yml"
scrape_configs:
  - job_name: 'devsecops-demo-staging'
    static_configs:
      - targets: ['localhost:8081']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
  - job_name: 'devsecops-demo-production'
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
